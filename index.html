<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Plant cell · CellScape</title>
  <meta name="description" content="Explore a living 3D plant cell: zoom from the whole cell into its organelles and down to the molecules, and see how every part depends on the others." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="assets/css/cellscape.css" />
  <link rel="stylesheet" href="assets/css/world.css" />
  <script type="importmap">
    { "imports": { "three": "./assets/vendor/three/build/three.module.js", "three/addons/": "./assets/vendor/three/examples/jsm/" } }
  </script>
</head>
<body>
  <div class="sim-shell">
    <header class="sim-header"></header>
    <main class="stage" id="stage">
      <canvas id="canvas" aria-label="Interactive 3D plant cell. Organelles exchange glucose, oxygen, carbon dioxide, ATP, mRNA, proteins and water. The What's happening panel describes the current state of the cell."></canvas>
      <div id="labels"></div>
      <div class="stage-overlay" id="overlay"></div>
    </main>
    <aside class="panel" id="panel"></aside>
  </div>
  <noscript>CellScape needs JavaScript. <a href="library.html">See all simulations</a>.</noscript>
  <script type="module">
    let gl = false;
    try { const c = document.createElement("canvas"); gl = !!(c.getContext("webgl2") || c.getContext("webgl")); } catch {}
    if (!gl) location.replace("library.html");
    else import("./assets/js/world/shell.js").then((m) => m.boot({ start: "cell", root: "" }));
  </script>
</body>
</html>
