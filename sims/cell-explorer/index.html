<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <script>(function(){var t="auto";try{t=localStorage.getItem("cellscape.theme")||"auto"}catch(e){}if(t!=="light"&&t!=="dark"){try{t=matchMedia("(prefers-color-scheme: light)").matches?"light":"dark"}catch(e){t="dark"}}document.documentElement.dataset.theme=t;document.documentElement.style.colorScheme=t})()</script>
  <title>Cell Explorer · CellScape</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Space+Grotesk:wght@500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../../assets/css/cellscape.css" />
  <style>
    .stage canvas { cursor: grab; }
    .stage canvas.grabbing { cursor: grabbing; }
    .stage canvas.pointing { cursor: pointer; }
    .stage canvas:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
    .zoom-ctrl {
      position: absolute; right: 14px; bottom: 14px; display: flex; flex-direction: column; gap: 6px; z-index: 2;
    }
    .zoom-ctrl button {
      width: 40px; height: 40px; border-radius: 12px; border: 1px solid var(--panel-border);
      background: rgba(5, 11, 22, 0.78); color: var(--ink); font-size: 1.25rem; line-height: 1; cursor: pointer;
    }
    .zoom-ctrl button:hover { border-color: var(--accent); }
    .zoom-ctrl button.fit { font-size: 0.72rem; font-weight: 600; }
    .hunt-banner {
      flex-basis: 100%; pointer-events: auto; display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
      background: rgba(10, 22, 40, 0.9); border: 1px solid var(--accent-3); border-radius: 12px;
      padding: 8px 12px; font-size: 0.92rem; color: var(--ink); box-shadow: 0 6px 24px rgba(0,0,0,0.35);
    }
    .hunt-banner .lbl { color: var(--accent-3); font-weight: 600; font-family: var(--font-display); letter-spacing: 0.04em; }
    .hunt-banner .timer { margin-left: auto; font-variant-numeric: tabular-nums; color: var(--ink-dim); }
    .hunt-banner .bar { flex-basis: 100%; height: 3px; background: rgba(255,255,255,0.08); border-radius: 3px; overflow: hidden; }
    .hunt-banner .bar > div { height: 100%; background: var(--accent-3); }
    .org-name { display: flex; align-items: center; gap: 8px; margin: 0 0 6px; font-family: var(--font-display); font-size: 1.1rem; font-weight: 600; }
    .org-name i { width: 14px; height: 14px; border-radius: 50%; flex: 0 0 14px; box-shadow: 0 0 10px currentColor; }
    .info .fact { background: rgba(251, 191, 36, 0.07); border-left: 3px solid var(--accent-3); padding: 6px 8px; border-radius: 6px; font-size: 0.86rem; }
    .info .meta { font-size: 0.82rem; color: var(--ink-faint); margin-top: 6px; }
    .found { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; font-size: 0.8rem; color: var(--ink-faint); margin-top: 4px; }
    .found span { padding: 2px 9px; border-radius: 999px; border: 1px solid var(--panel-border); }
    .found span.on { border-color: var(--good); color: var(--ink); background: rgba(74, 222, 128, 0.12); }
    .found span.off { opacity: 0.45; text-decoration: line-through; }
    .explain .note { font-size: 0.78rem; color: var(--ink-faint); }
    .compare .opts { display: flex; flex-wrap: wrap; gap: 6px; }
    .compare .opts .btn { padding: 6px 10px; font-size: 0.82rem; }
    .compare .fb { font-size: 0.85rem; color: var(--ink-dim); margin-top: 6px; min-height: 1.2em; }
    .hunt-card .big { font-size: 1.6rem; font-family: var(--font-display); color: var(--accent-3); }
    .ctl-label { font-size: 0.8rem; color: var(--ink-faint); margin: 10px 0 4px; }
    .ctl-label:first-of-type { margin-top: 0; }
    @media (max-width: 860px) {
      .zoom-ctrl button { width: 44px; height: 44px; }
    }
  </style>
</head>
<body>
  <div class="sim-shell">
    <header class="sim-header">
      <a class="back" href="../../index.html">← CellScape</a>
      <h1>Cell Explorer</h1>
      <span class="tag">Stage 4 · Cells &amp; classification / Biology Y11 · Module 1 · Cell structure</span>
      <span class="cs-theme-slot"></span>
    </header>
    <main class="stage" id="stage">
      <canvas id="canvas" tabindex="0" aria-label="Cell Explorer simulation: a living animal, plant or bacterial cell you can pan by dragging and zoom with the mouse wheel, pinch or the plus and minus buttons (or the + and − keys and arrow keys). Tap any organelle to see its name, function and size in the side panel. The What's happening panel describes what is currently on screen."></canvas>
      <div class="stage-overlay" id="overlay"></div>
    </main>
    <aside class="panel" id="panel"></aside>
  </div>
  <script type="module" src="./sim.js"></script>
  <script type="module">import("../../assets/js/world/theme.js").then((m) => { const s = document.querySelector(".cs-theme-slot"); if (s) m.mountThemeToggle(s); });</script>
</body>
</html>
