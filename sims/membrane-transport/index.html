<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <script>(function(){var t="auto";try{t=localStorage.getItem("cellscape.theme")||"auto"}catch(e){}if(t!=="light"&&t!=="dark"){try{t=matchMedia("(prefers-color-scheme: light)").matches?"light":"dark"}catch(e){t="dark"}}document.documentElement.dataset.theme=t;document.documentElement.style.colorScheme=t})()</script>
  <title>Membrane Transport · CellScape</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Space+Grotesk:wght@500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../../assets/css/cellscape.css" />
  <link rel="stylesheet" href="../../assets/css/world.css" />
  <script type="importmap">
    { "imports": { "three": "../../assets/vendor/three/build/three.module.js", "three/addons/": "../../assets/vendor/three/examples/jsm/" } }
  </script>
</head>
<body>
  <div class="sim-shell">
    <header class="sim-header">
      <a class="back" href="../../index.html">← CellScape</a>
      <h1>Membrane Transport</h1>
      <span class="tag">Biology Y11 · Module 1 · Cell membrane transport</span>
      <span class="tag" id="cfg-switch">Show: <a href="?config=animal">animal cell membrane</a> · <a href="?config=plant">plant cell membrane</a></span>
      <span class="cs-theme-slot"></span>
    </header>
    <main class="stage" id="stage">
      <canvas id="canvas" aria-label="Membrane transport simulation: a phospholipid bilayer separating extracellular fluid (top) from cytoplasm (bottom), with an aquaporin, a potassium channel, a GLUT glucose carrier, a sodium-potassium pump and a sodium channel. Oxygen, carbon dioxide, water, glucose, sodium, potassium and large protein molecules move between the two sides. The What's happening panel describes the current state."></canvas>
      <div id="labels"></div>
      <div class="stage-overlay" id="overlay"></div>
    </main>
    <aside class="panel" id="panel"></aside>
  </div>
  <script type="module">
    // three.js r169 needs WebGL2; without it (or if 3D fails to start) use the 2D version of this simulation
    let gl = false;
    try { gl = !!document.createElement("canvas").getContext("webgl2") && sessionStorage.getItem("cs2d") !== "1"; } catch { gl = false; }
    const fallback = () => { document.getElementById("labels")?.remove(); document.getElementById("cfg-switch")?.remove(); /* the 2D version shows the animal configuration only */ import("./sim2d.js"); };
    if (!gl) fallback();
    else import("../../assets/js/world/shell.js")
      .then((m) => m.boot({ start: "membrane", root: "../../" }))
      .catch((e) => { console.error(e); try { sessionStorage.setItem("cs2d", "1"); } catch {} location.reload(); });
  </script>
  <script>(function(){try{var c=new URLSearchParams(location.search).get("config")==="plant"?"plant":"animal",a=document.querySelectorAll("#cfg-switch a");a[c==="plant"?1:0].setAttribute("aria-current","true");a[c==="plant"?1:0].style.fontWeight="700"}catch(e){}})()</script>
  <script type="module">import("../../assets/js/world/theme.js").then((m) => { const s = document.querySelector(".cs-theme-slot"); if (s) m.mountThemeToggle(s); });</script>
</body>
</html>
