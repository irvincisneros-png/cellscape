<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <script>(function(){var t="auto";try{t=localStorage.getItem("cellscape.theme")||"auto"}catch(e){}if(t!=="light"&&t!=="dark"){try{t=matchMedia("(prefers-color-scheme: light)").matches?"light":"dark"}catch(e){t="dark"}}document.documentElement.dataset.theme=t;document.documentElement.style.colorScheme=t})()</script>
  <title>Cell Division: Mitosis · CellScape</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Space+Grotesk:wght@500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../../assets/css/cellscape.css" />
  <link rel="stylesheet" href="../../assets/css/world.css" />
  <!-- styles used by the 2D fallback (sim2d.js) -->
  <style>
    .explain .task {
      margin-top: 8px; padding: 8px 10px; border-radius: 10px;
      border: 1px solid rgba(251, 191, 36, 0.45); background: rgba(251, 191, 36, 0.08); color: var(--ink);
    }
    .explain .note { font-size: 0.78rem; color: var(--ink-faint); }
    .countcard .opts { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
    .countcard .fb { font-size: 0.85rem; margin-top: 8px; color: var(--ink-dim); }
    .act-row .btn { flex: 1 1 auto; }
    .btn.holding { background: rgba(251, 191, 36, 0.3); border-color: var(--accent-3); }
    .legend .wide { grid-column: 1 / -1; }
    .legend i.bar { border-radius: 3px; height: 6px; width: 16px; flex-basis: 16px; }
  </style>
  <script type="importmap">
    { "imports": { "three": "../../assets/vendor/three/build/three.module.js", "three/addons/": "../../assets/vendor/three/examples/jsm/" } }
  </script>
</head>
<body>
  <div class="sim-shell">
    <header class="sim-header">
      <a class="back" href="../../index.html">← CellScape</a>
      <h1>Cell Division: Mitosis</h1>
      <span class="tag">Biology Y11 · Cells as the basis of life · Cell replication</span>
      <span class="cs-theme-slot"></span>
    </header>
    <main class="stage" id="stage">
      <canvas id="canvas" aria-label="Cell division simulation: a plant (or animal) cell with four chromosomes in two homologous pairs copies its DNA, builds a spindle, lines the chromosomes up, separates the sister chromatids and divides into two daughter cells. The What's happening panel describes the current phase and what the cell is waiting for."></canvas>
      <div id="labels"></div>
      <div class="stage-overlay" id="overlay"></div>
    </main>
    <aside class="panel" id="panel"></aside>
  </div>
  <script type="module">
    // three.js r169 needs WebGL2; without it (or if 3D fails to start) use the 2D version of this simulation
    let gl = false;
    try { gl = !!document.createElement("canvas").getContext("webgl2") && sessionStorage.getItem("cs2d") !== "1"; } catch { gl = false; }
    const fallback = () => { document.getElementById("labels")?.remove(); import("./sim2d.js"); };
    if (!gl) fallback();
    else import("../../assets/js/world/shell.js")
      .then((m) => m.boot({ start: "mitosis", root: "../../" }))
      .catch((e) => { console.error(e); try { sessionStorage.setItem("cs2d", "1"); } catch {} location.reload(); });
  </script>
  <script type="module">import("../../assets/js/world/theme.js").then((m) => { const s = document.querySelector(".cs-theme-slot"); if (s) m.mountThemeToggle(s); });</script>
</body>
</html>
