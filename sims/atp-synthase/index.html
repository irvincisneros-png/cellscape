<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Cellular Respiration: The ATP Factory · CellScape</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Space+Grotesk:wght@500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../../assets/css/cellscape.css" />
  <style>
    .explain .note { font-size: 0.78rem; color: var(--ink-faint); }
    .flow { list-style: none; padding: 0; margin: 0 0 10px; display: flex; flex-direction: column; gap: 12px; }
    .flow li {
      position: relative; display: grid; grid-template-columns: 1fr auto; gap: 1px 8px;
      padding: 7px 9px; border-radius: 9px; font-size: 0.84rem;
      background: rgba(255, 255, 255, 0.03); border: 1px solid var(--panel-border);
    }
    .flow li b { color: var(--ink); font-weight: 600; }
    .flow li span { grid-column: 1; color: var(--ink-faint); font-size: 0.76rem; }
    .flow li em { grid-column: 2; grid-row: 1 / span 2; align-self: center; text-align: right; font-style: normal; color: var(--accent-3); font-size: 0.78rem; }
    .flow li.here { border-color: var(--accent-3); background: rgba(251, 191, 36, 0.08); }
    .flow li + li::before { content: "↓"; position: absolute; top: -13px; left: 14px; color: var(--ink-faint); font-size: 0.7rem; }
    .resp details summary { cursor: pointer; color: var(--ink-dim); font-size: 0.88rem; margin-bottom: 8px; }
    .speed-label { font-size: 0.88rem; margin: 10px 0 6px; }
  </style>
</head>
<body>
  <div class="sim-shell">
    <header class="sim-header">
      <a class="back" href="../../index.html">← CellScape</a>
      <h1>Cellular Respiration: The ATP Factory</h1>
      <span class="tag">Biology Y11 · Module 1 · Cellular respiration</span>
    </header>
    <main class="stage" id="stage">
      <canvas id="canvas" aria-label="Cellular Respiration: The ATP Factory simulation. A section of the inner mitochondrial membrane with electron transport chain complexes I to IV pumping hydrogen ions into the intermembrane space, and ATP synthase turning as hydrogen ions flow back to make ATP. Drag in a circle around ATP synthase to crank it by hand. The What's happening panel describes the current state."></canvas>
      <div class="stage-overlay" id="overlay"></div>
    </main>
    <aside class="panel" id="panel"></aside>
  </div>
  <script type="module" src="./sim.js"></script>
</body>
</html>
