<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Enzyme Lab · CellScape</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Space+Grotesk:wght@500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../../assets/css/cellscape.css" />
  <link rel="stylesheet" href="../../assets/css/world.css" />
  <script type="importmap">
    { "imports": { "three": "../../assets/vendor/three/build/three.module.js", "three/addons/": "../../assets/vendor/three/examples/jsm/" } }
  </script>
</head>
<body>
  <div class="sim-shell">
    <header class="sim-header">
      <a class="back" href="../../index.html">← CellScape</a>
      <h1>Enzyme Lab</h1>
      <span class="tag">Stage 5 / Biology Y11 · Module 1 · Enzymes</span>
    </header>
    <main class="stage" id="stage">
      <canvas id="canvas" aria-label="Enzyme Lab simulation: a 3D patch of cytosol with glossy enzyme molecules, each with a glowing active-site groove and an allosteric dimple on the far side, among tumbling substrate molecules. Drag a substrate into an active site, tap a molecule to rotate it, tap an enzyme to follow and inspect it. Heat or extreme pH makes enzymes unravel into loose chains. The What's happening panel describes the current state."></canvas>
      <div id="labels"></div>
      <div class="stage-overlay" id="overlay"></div>
    </main>
    <aside class="panel" id="panel"></aside>
  </div>
  <script type="module">
    // three.js r169 needs WebGL2; without it (or if 3D fails to start) use the 2D version of this simulation
    let gl = false;
    try { gl = !!document.createElement("canvas").getContext("webgl2") && sessionStorage.getItem("cs2d") !== "1"; } catch { gl = false; }
    const fallback = () => { document.getElementById("labels")?.remove(); import("./sim2d.js"); };
    if (!gl) fallback();
    else import("../../assets/js/world/shell.js")
      .then((m) => m.boot({ start: "enzymes", root: "../../" }))
      .catch((e) => { console.error(e); try { sessionStorage.setItem("cs2d", "1"); } catch {} location.reload(); });
  </script>
</body>
</html>
